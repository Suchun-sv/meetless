# The beta channel: every push to main builds Meetless's app code alone (dist/: main, preload,
# renderer; no Electron, no installers) into the rolling "hot" prerelease (the first tag, "beta", was frozen by an immutable release) as hot-<commit>.zip and a
# signed hot.json. Installed builds pick it up as a hot update (apps/desktop/src/main/hot-update.ts).
name: Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta
  # Never stop one mid-upload; a newer push waits.
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # Only the code ships; Electron itself is not needed to build it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build
        working-directory: apps/desktop
        env:
          MEETLESS_COMMIT: ${{ github.sha }}
        run: pnpm run build
      - name: Pack and sign
        working-directory: apps/desktop
        env:
          HOT_SIGNING_KEY: ${{ secrets.HOT_SIGNING_KEY }}
        run: node scripts/hot-pack.mjs release/hot
      - name: Publish to the hot prerelease
        working-directory: apps/desktop/release/hot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view hot >/dev/null 2>&1 || gh release create hot --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Meetless beta (hot updates)" \
            --notes "Hot updates for installed builds: every push to main replaces hot.json here. Installers are in the other releases."
          # The archive first, then the manifest that points at it.
          gh release upload hot hot-*.zip --clobber
          gh release upload hot hot.json --clobber
          # Keep the five newest archives (a client may still hold an older manifest for a while).
          gh release view hot --json assets -q '.assets[] | select(.name | startswith("hot-")) | "\(.createdAt) \(.name)"' \
            | sort -r | tail -n +6 | cut -d' ' -f2 | while read -r old; do gh release delete-asset hot "$old" -y; done
